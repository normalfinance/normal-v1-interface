name: i18n Sync

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      force_upload:
        description: 'Force upload sources even if no changes detected'
        required: false
        default: false
        type: boolean

jobs:
  i18n-sync:
    runs-on: ubuntu-latest
    if: >
      !contains(github.event.head_commit.message, '[skip i18n]')

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CI_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build internal packages (required for i18n ext)
        run: |
          npx turbo build \
            --filter="!@normalfinance/web" \
            --cache-dir=.turbo

      - name: Extract new translation keys
        working-directory: packages/web
        run: yarn i18n:extract

      - name: Check for changes in English translations
        id: check_changes
        working-directory: packages/web
        run: |
          if git diff --quiet HEAD src/locales/langs/en/; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected in English translations"
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in English translations"
            git diff --name-only HEAD src/locales/langs/en/
          fi

      - name: Upload sources to Crowdin
        if: >
          steps.check_changes.outputs.changes == 'true' ||
          github.event.inputs.force_upload == 'true'
        working-directory: packages/web
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_API_TOKEN: ${{ secrets.CROWDIN_API_TOKEN }}
        run: |
          echo "Uploading source files to Crowdin..."
          yarn i18n:upload

      - name: Machine-translate missing strings
        working-directory: packages/web
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_API_TOKEN: ${{ secrets.CROWDIN_API_TOKEN }}
          CROWDIN_MT_ENGINE_ID: ${{ secrets.CROWDIN_MT_ENGINE_ID }}
          CROWDIN_FALLBACK_MT_ENGINE_ID: ${{ secrets.CROWDIN_FALLBACK_MT_ENGINE_ID }}
        run: |
          echo "Running MT pre-translation via yarn script..."
          yarn i18n:pretranslate

      - name: Download translations from Crowdin
        working-directory: packages/web
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_API_TOKEN: ${{ secrets.CROWDIN_API_TOKEN }}
        run: |
          echo "Downloading translations from Crowdin..."
          yarn i18n:download

      - name: Check translation status
        working-directory: packages/web
        run: yarn i18n:status

      - name: Commit updated translations
        run: |
          git config --local user.email \
            "73488443+jaymalave@users.noreply.github.com"
          git config --local user.name "jaymalave"
          git add packages/web/src/locales/langs/
          if git diff --staged --quiet; then
            echo "No translation changes to commit"
          else
            echo "Committing translation updates..."
            git commit -m "chore: update translations from Crowdin [skip ci]"
            git push
          fi

      - name: Create PR comment with translation status (on PR)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            try {
              const status = execSync(
                'npm run i18n:status',
                { encoding: 'utf8', cwd: 'packages/web' }
              );
              const body = `## 🌍 Translation Status Update

This PR triggers i18n extraction. Here's the current translation status:

\`\`\`
${status}
\`\`\`

_Generated by GitHub Actions i18n workflow_`;
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            } catch (err) {
              console.log('Failed to post translation status:', err);
            }