name: i18n Sync

on:
  push:
    branches: 
      - '**'
    # paths:
    #   - 'packages/web/src/**/*.{js,jsx,ts,tsx}'
    #   - 'packages/web/src/locales/langs/en/**/*.json'
  

  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      force_upload:
        description: 'Force upload sources even if no changes detected'
        required: false
        default: 'false'
        type: boolean

jobs:
  i18n-sync:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip i18n]')"
    
    defaults:
      run:
        working-directory: packages/web
        
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'
          
      - name: Install dependencies
        run: yarn install --frozen-lockfile
        
      - name: Build internal packages (required for i18n extraction)
        run: npx turbo build --filter="!@normalfinance/web" --cache-dir=.turbo
        
      - name: Extract new translation keys
        run: yarn i18n:extract
        
      - name: Check for changes in English translations
        id: check_changes
        run: |
          if git diff --quiet HEAD src/locales/langs/en/; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected in English translations"
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in English translations"
            git diff --name-only HEAD src/locales/langs/en/
          fi
        
      - name: Upload sources to Crowdin
        if: steps.check_changes.outputs.changes == 'true' || github.event.inputs.force_upload == 'true'
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_API_TOKEN: ${{ secrets.CROWDIN_API_TOKEN }}
        run: |
          echo "Uploading source files to Crowdin..."
          yarn i18n:upload


      - name: Machine-translate missing strings
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_API_TOKEN: ${{ secrets.CROWDIN_API_TOKEN }}
          CROWDIN_MT_ENGINE_ID: ${{ secrets.CROWDIN_MT_ENGINE_ID }}
          CROWDIN_FALLBACK_MT_ENGINE_ID: ${{ secrets.CROWDIN_FALLBACK_MT_ENGINE_ID }}
        run: |
          echo "Running MT pre-translation via yarn script..."
          yarn i18n:pretranslate
        
      - name: Download translations from Crowdin
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_API_TOKEN: ${{ secrets.CROWDIN_API_TOKEN }}
        run: |
          echo "Downloading translations from Crowdin..."
          yarn i18n:download
          
      - name: Check translation status
        run: yarn i18n:status
        
      - name: Commit updated translations
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions i18n Bot"
          
          # Add all translation files
          git add src/locales/langs/
          
          # Check if there are any changes to commit
          if git diff --staged --quiet; then
            echo "No translation changes to commit"
          else
            echo "Committing translation updates..."
            git commit -m "chore: update translations from Crowdin [skip ci]"
            git push
          fi
          
      - name: Create PR comment with translation status (on PR)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            
            try {
              // Run translation status check and capture output
              const statusOutput = execSync('cd packages/web && npm run i18n:status', { encoding: 'utf8' });
              
              const body = `## 🌍 Translation Status Update
              
              This PR triggers i18n extraction. Here's the current translation status:
              
              \`\`\`
              ${statusOutput}
              \`\`\`
              
              _Generated by GitHub Actions i18n workflow_`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } catch (error) {
              console.log('Failed to post translation status:', error.message);
            } 