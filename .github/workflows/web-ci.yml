name: Web CI

on:
  pull_request:
    paths:
      - 'packages/web/**'
  push:
    branches: 
      - '**'
    # paths:
    #   - 'packages/web/**'

jobs:
  web:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: [20.x]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
          # cache-dependency-path: packages/web/yarn.lock

      - name: Install dependencies (Yarn)
        run: yarn install --frozen-lockfile

      - name: Build internal packages (turborepo)
        run: npx turbo build --filter="!@normalfinance/web" --cache-dir=.turbo

      # ---------- Quality Gates ----------
      - name: Prettier – formatting check
        working-directory: packages/web
        run: yarn fm:check

      - name: ESLint – code-quality check
        working-directory: packages/web
        run: yarn lint

      # Extract translation keys before downloading to ensure English files are current
      - name: i18n – extract translation keys
        working-directory: packages/web
        run: yarn i18n:extract

      - name: i18n – download latest translations
        working-directory: packages/web
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_API_TOKEN: ${{ secrets.CROWDIN_API_TOKEN }}
        run: |
          if [ -n "$CROWDIN_PROJECT_ID" ] && [ -n "$CROWDIN_API_TOKEN" ]; then
            echo "Downloading latest translations from Crowdin..."
            yarn i18n:download || echo "Warning: Failed to download translations, continuing with existing ones"
          else
            echo "Crowdin credentials not available, skipping translation download"
          fi

      # Check for untranslated / missing keys across all locale JSON files
      - name: i18n – translation completeness check
        working-directory: packages/web
        run: yarn i18n:check

      - name: Prisma - Generate Prisma Client
        run: yarn prisma generate

      - name: TypeScript – type check
        working-directory: packages/web
        run: npx tsc --noEmit --project tsconfig.json
      
      - name: Next.js – production build
        working-directory: packages/web
        env:
          NEXT_PUBLIC_APP_ENV: ci
        run: yarn build

