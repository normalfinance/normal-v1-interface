          'CBY6HH7FFNBLARQYSKJAK6O2AGPTM5VYGOYHTQQPTFLUTS2DNOXPT5QD',         -- Pool Swap Fee
          'CBFZY3TUS4NGJRTBJ3Y3NONTNL25WOPOQ5HRVTBVROMQVEB2XMWBEPK2',         -- Pool Plane
          'CB5TC2DCKGHMHOREAKXCKEE2Z5LRY7G66RR2ZZBVJBRPA5DVHEF326LA',         -- Liquidity Calc.
