transforms:
  sql_1:
    type: sql
    primary_key: id
    sql: |-
      SELECT
        s.*, 
        now() AS goldsky_timestamp
      FROM source_1
      WHERE type = 'contract'
        AND in_successful_contract_call = true
        AND contract_id IN (
          'CB3WPZSLXRRWLA4ZFTUDJQJ52R6NB33SKORK6ZXEXD7AHDPTNFKRFZPR',         -- Treasury
          'CCHY4LTWF263P6QOOID5IFLXUGJCPAERCKZW7MKFJKNUC3OSGLXQCDTH',         -- Long Short Pair Factory
        )
sinks:
  sink_1:
    type: postgres
    table: normal_contract_events_testnet
    schema: public
    secret_name: SUPABASE_POSTGRES
    from: sql_1
use_dedicated_ip: false
