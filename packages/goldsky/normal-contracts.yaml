name: normal-contracts
version: 1
resource_size: s
apiVersion: 3
sources:
  source_1:
    dataset_name: stellar.events_v2
    version: 1.0.0
    type: dataset
    start_at: latest
transforms:
  filter_by_normal_contracts:
    type: sql
    primary_key: id
    sql: |-
      SELECT *
      FROM source_1
      WHERE type = 'contract'
        AND in_successful_contract_call = true
        AND contract_id IN (
          '9d0e2495a5cea8a651e87d8e5aced3b159afe7102cc728f275e9a2f0ea3d2e29', -- Pool Router
          'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa', -- Oracle Registry
          'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb', -- Pool Swap Fee
          'cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc', -- Buffer
          'cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc'  -- Insurance Fund
        )
sinks:
  supabase_postgres:
    type: postgres
    table: goldsky
    schema: public
    secret_name: POSTGRES_SECRET_CMCY2QIS60
    from: filter_by_normal_contracts
use_dedicated_ip: false
